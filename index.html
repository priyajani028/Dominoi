<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dominoi — a 3D domino playground</title>
    <meta name="description" content="Dominoi: arrange, stack and lean dominoes on an endless 3D table, then knock them down with a red ball." />
    <meta name="theme-color" content="#ecebe7" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dominoi" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dominoi — a 3D domino playground" />
    <meta property="og:description" content="Stand, stack and lean dominoes on an endless 3D table, then knock them all down with a red ball." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dominoi — a 3D domino playground" />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Static splash: visible instantly, faded out by the app after the first 3D frame. -->
    <div id="splash" role="status" aria-label="Loading Dominoi">
      <img src="/favicon.svg" alt="" width="64" height="64" />
      <div class="splash-name">Dominoi</div>
      <div class="splash-bar"><i></i></div>
    </div>
    <noscript><p style="font-family:system-ui;padding:24px">Dominoi needs JavaScript to run.</p></noscript>
    <style>
      #splash { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #ecebe7; transition: opacity .6s ease, visibility .6s; }
      #splash.is-gone { opacity: 0; visibility: hidden; }
      #splash img { border-radius: 16px; box-shadow: 0 12px 30px -10px rgba(38,34,31,.45); animation: splash-in .8s cubic-bezier(.22,1,.36,1) both; }
      .splash-name { font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; color: #26221f; letter-spacing: -.01em; }
      .splash-bar { width: 120px; height: 3px; border-radius: 2px; background: rgba(60,45,30,.1); overflow: hidden; }
      .splash-bar i { display: block; width: 40%; height: 100%; background: #e3123a; border-radius: 2px; animation: splash-bar 1.1s ease-in-out infinite; }
      @keyframes splash-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @keyframes splash-in { from { opacity: 0; transform: translateY(8px) scale(.96); } }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
